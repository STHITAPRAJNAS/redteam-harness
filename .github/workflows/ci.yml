name: ci

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 (our minimum) isn't on the newest ubuntu-latest image, so pin it
          # to 22.04 which still ships it; 3.12 runs on latest.
          - { python-version: "3.9", os: ubuntu-22.04 }
          - { python-version: "3.12", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (with server extra)
        run: pip install ".[server,yaml]"
      - name: Byte-compile
        run: python -m compileall -q rtharness examples
      - name: Selftest (keyless)
        run: rtharness selftest --tier 3
      - name: Smoke the web service + MCP tool endpoint
        run: |
          python -m examples.mock_server --port 8099 &
          sleep 2
          rtharness run --target a2a --base-url http://127.0.0.1:8099 \
            --preset standard --format json --out reports --quiet
      - name: Upload SARIF (optional security tab)
        if: always()
        run: |
          rtharness run --target a2a --base-url http://127.0.0.1:8099 \
            --preset owasp-llm --format sarif --out reports --quiet || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.python-version }}
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: selftest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rtharness:ci .
      - name: Smoke the image
        run: |
          docker run --rm -d --name rt -p 8900:8900 rtharness:ci
          sleep 3
          curl -fsS http://127.0.0.1:8900/health
          docker rm -f rt
